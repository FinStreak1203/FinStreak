name: finella
description: "Finella - Personal Finance App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  fl_chart: ^0.68.0
  confetti: ^0.7.0
  share_plus: ^7.2.1
  google_fonts: ^6.2.1
  uuid: ^4.5.3
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.2
  http: ^1.6.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  another_telephony: ^0.4.1
  permission_handler: ^12.0.3
  syncfusion_flutter_pdf: ^33.2.15
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.23.1
  riverpod_generator: ^2.6.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/banks/
    - assets/images/wallets/
    - assets/images/ott/
    - assets/images/cards/
    - assets/images/icons/
    - assets/images/general/
    - assets/images/brand/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700

# App icon generated from the FinStreak logo kit (Mark 1 Bold Tick, Streak Green).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/brand/app_icon_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/brand/app_icon_1024.png"
    background_color: "#214D2A"
    theme_color: "#214D2A"
  windows:
    generate: true
    image_path: "assets/images/brand/app_icon_1024.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/brand/app_icon_1024.png"
